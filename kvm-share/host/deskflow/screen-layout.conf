# Deskflow 屏幕布局（外部配置，服务端读取）
# 上下排布：主机 i5-5200u 在上，Surface（chenwei-Surface-Pro）在下
# 光标从主机屏幕下边缘移出 → 进入 Surface；从 Surface 上边缘推回

section: screens
	i5-5200u:
	chenwei-Surface-Pro:
end

section: links
	i5-5200u:
		down = chenwei-Surface-Pro
	chenwei-Surface-Pro:
		up = i5-5200u
end

section: options
	protocol = barrier
	# 剪贴板共享已移除（Wayland 主机不生效，且会抢 selection 打断输入法）
	clipboardSharing = false
	clipboardSharingSize = 64
end
